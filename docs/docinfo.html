<!-- Polished motion + style tuning for the deck: color, type, spacing, pacing -->
<style>
:root{
  /* Color palette tuned to the hero image (warm gradient + dark text) */
  --bg-gradient-start:  #7f1dba; /* deep purple */
  --bg-gradient-end:    #ff6f61; /* coral */
  --surface:            #ffffff;
  --muted:              #6b7280;
  --text:               #0f172a;
  --accent:             #ff6f61;
  --accent-2:           #ffb88c;

  /* Motion & pacing */
  --frag-stagger: 0.10s;        /* base gap between fragments */
  --frag-ease: cubic-bezier(.22,.9,.35,1);
  --heading-ease: cubic-bezier(.2,.8,.2,1);
  --motion-duration: 16s;       /* background subtle motion length */
  --transition-speed: 520ms;    /* base transition for fragment in/out */

  /* Typography & spacing */
  --base-font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
  --heading-weight: 700;
  --body-weight: 400;
  --slide-padding: 48px;
}

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce) {
  :root{ --frag-stagger: 0s; --motion-duration: 0s; --transition-speed: 0ms; }
  .reveal .slides *, .reveal .slides { transition: none !important; animation: none !important; }
}

/* Apply a subtle hero gradient behind slides (non-invasive) */
.reveal {
  background: linear-gradient(120deg, var(--bg-gradient-start), var(--bg-gradient-end));
}
.reveal .backgrounds { opacity: 0.06; }

/* Subtle animated background overlay to add depth */
.reveal.with-subtle-motion::before{
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(1200px 400px at 10% 20%, rgba(255,255,255,0.03), transparent), linear-gradient(120deg, rgba(255,255,255,0.02), rgba(0,0,0,0.02));
  mix-blend-mode: overlay;
  animation: subtleShift var(--motion-duration) linear infinite;
}
@keyframes subtleShift{
  0% { transform: translate3d(0,0,0) rotate(0deg); }
  50% { transform: translate3d(1.2%, -1.2%, 0) rotate(.25deg); }
  100% { transform: translate3d(0,0,0) rotate(0deg); }
}

/* Base font tuning */
.reveal .slides { font-family: var(--base-font); color: var(--text); }
.reveal .slides section { padding: var(--slide-padding); box-sizing: border-box; }

/* Heading scale and clarity */
.reveal .slides h1 { font-size: 3.2rem; font-weight: var(--heading-weight); margin-bottom: 0.6rem; color: var(--surface); text-shadow: 0 6px 20px rgba(0,0,0,0.12); }
.reveal .slides h2 { font-size: 1.6rem; font-weight: var(--heading-weight); color: var(--text); }

/* Card surface for dense content to give breathing room */
.reveal .slides .card { background: rgba(255,255,255,0.96); padding: 22px; border-radius: 12px; box-shadow: 0 10px 30px rgba(12,20,30,0.06); color: var(--text); }

/* Fragment entrance: staggered by index --frag-index */
.reveal .slides .fragment{
  opacity: 0;
  transform: translateY(10px) scale(.995);
  transition: opacity var(--transition-speed) var(--frag-ease), transform var(--transition-speed) var(--frag-ease);
}
.reveal .slides .fragment.visible{
  opacity: 1;
  transform: none;
  transition-delay: calc(var(--frag-index, 0) * var(--frag-stagger));
}

/* Emphasis helper for key phrases */
.emph-animate{ display: inline-block; position: relative; transform-origin:left center; transition: transform 360ms var(--heading-ease), color 240ms ease; }
.reveal .slides section .emph-animate.visible{ transform: translateY(-6px); color: var(--accent); }

/* Heading entrance for better pacing */
.reveal .slides h1, .reveal .slides h2 { opacity: 0; transform: translateY(8px); transition: transform 640ms var(--heading-ease), opacity 640ms var(--heading-ease); }
.reveal .slides h1.visible, .reveal .slides h2.visible { opacity:1; transform: none; }

/* Slightly larger section-break slides */
.reveal .slides section.section-break { display: flex; align-items:center; justify-content:center; text-align:center; }
.reveal .slides section.section-break h1 { font-size: 3.6rem; letter-spacing: .02em; color: var(--surface); }

/* Code & image fragment polish */
.reveal .slides pre.fragment, .reveal .slides img.fragment{ will-change: transform, opacity; box-shadow: 0 12px 36px rgba(2,6,23,0.08); border-radius:8px; }

/* Muted text */
.reveal .slides p, .reveal .slides li { color: var(--muted); font-weight: var(--body-weight); }

</style>

<script>
// Polished motion + pacing control
document.addEventListener('DOMContentLoaded', function(){
  function ready(){
    if(!window.Reveal) return setTimeout(ready,50);

    // Add subtle-motion class to Reveal root so overlay animates
    var revealRoot = document.querySelector('.reveal');
    if(revealRoot) revealRoot.classList.add('with-subtle-motion');

    // Pace presets: ?pace=fast | medium | slow
    var url = new URL(window.location.href);
    var pace = url.searchParams.get('pace') || 'medium';
    var presets = {
      fast:   { transitionSpeed: 'fast', fragStagger: 0.06, transitionMs: 300 },
      medium: { transitionSpeed: 'default', fragStagger: 0.10, transitionMs: 520 },
      slow:   { transitionSpeed: 'slow', fragStagger: 0.14, transitionMs: 760 }
    };
    var p = presets[pace] || presets.medium;

    // Apply CSS variables for chosen pace
    document.documentElement.style.setProperty('--frag-stagger', p.fragStagger + 's');
    document.documentElement.style.setProperty('--transition-speed', p.transitionMs + 'ms');

    try{
      Reveal.configure({
        transition: 'convex',
        transitionSpeed: p.transitionSpeed,
        backgroundTransition: 'fade',
        fragmentInURL: true,
        viewDistance: 3
      });
    }catch(e){/* ignore if not available */}

    // Assign fragment indices and auto-fragment content
    document.querySelectorAll('.reveal .slides section').forEach(function(section){
      var fragIndex = 0;

      if(section.classList.contains('section-break')){
        section.setAttribute('data-transition', 'zoom');
      }

      // Auto-fragment lists
      section.querySelectorAll('ul, ol').forEach(function(list){
        var items = Array.prototype.slice.call(list.children).filter(function(n){ return n.tagName === 'LI'; });
        if(items.length > 0){
          items.forEach(function(li, i){
            if(!li.classList.contains('fragment')) li.classList.add('fragment');
            li.style.setProperty('--frag-index', i);
          });
          fragIndex = Math.max(fragIndex, items.length);
        }
      });

      // Auto-fragment images
      section.querySelectorAll('img').forEach(function(img, i){
        if(!img.classList.contains('fragment')) img.classList.add('fragment');
        img.style.setProperty('--frag-index', (fragIndex++) + i);
      });

      // Auto-fragment code blocks
      section.querySelectorAll('pre, code').forEach(function(node, i){
        if(!node.classList.contains('fragment')) node.classList.add('fragment');
        node.style.setProperty('--frag-index', (fragIndex++) + i + 8);
      });
    });

    // Slide entrance animations
    Reveal.on && Reveal.on('slidechanged', function(event){
      var slide = event.currentSlide || event.slide || document.querySelector('.reveal .slides section.present');
      if(!slide) return;

      var headers = slide.querySelectorAll('h1, h2');
      headers.forEach(function(h, idx){
        h.classList.remove('visible');
        setTimeout(function(){ h.classList.add('visible'); }, 80 * idx + 60);
      });

      slide.querySelectorAll('.emph-animate').forEach(function(e){
        e.classList.remove('visible');
        setTimeout(function(){ e.classList.add('visible'); }, 120);
      });
    });

    // Fragment visibility toggles
    Reveal.on && Reveal.on('fragmentshown', function(e){ var el = e.fragment || e.currentTarget || e; if(el){ el.classList.add('visible'); }});
    Reveal.on && Reveal.on('fragmenthidden', function(e){ var el = e.fragment || e.currentTarget || e; if(el){ el.classList.remove('visible'); }});
  }
  ready();
});
</script>
