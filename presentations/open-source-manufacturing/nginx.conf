server {
    listen 80 default_server;
    server_name _;
    
    root /usr/share/nginx/html;
    
    # serve index.html for root and any directory
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Also serve reveal.md/reveal.js static files from /reveal and /reveal.js
    location ^~ /reveal/ {
        alias /usr/share/nginx/html/reveal/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /reveal.js/ {
        alias /usr/share/nginx/html/reveal/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }
    
    # serve static assets with appropriate caching
    location ~* ^/(assets|css|js|images|fonts|lib)/ {
        expires 1h;
        add_header Cache-Control "public, immutable";
    }
    
    # proper MIME types for web assets
    types {
        text/html html htm;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/svg+xml svg svgz;
        font/ttf ttf;
        font/otf otf;
        font/woff woff;
        font/woff2 woff2;
        text/plain txt;
        application/octet-stream bin exe dll;
        application/octet-stream deb;
    }
    
    # gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss;
}
