services:
  presentation:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile
    container_name: asciidoc-revealjs-presentation
    ports:
      - "4200:4200"
    volumes:
      - ../../docs:/app/docs
      - ../../src:/app/src
      - ../../public:/app/public
    environment:
      - PORT=4200
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get('http://127.0.0.1:4200', res => process.exit(res.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped